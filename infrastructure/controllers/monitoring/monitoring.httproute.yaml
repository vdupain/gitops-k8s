---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${grafanaIngressHost}"
  rules:
    - backendRefs:
        - name: prometheus-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${prometheusIngressHost}"
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${alertmanagerIngressHost}"
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-alertmanager
          port: 9093
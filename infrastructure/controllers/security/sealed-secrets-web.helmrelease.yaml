---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets-web
  namespace: sealed-secrets
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: sealed-secrets-web
      version: 3.3.1
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets-web
        namespace: flux-system
      interval: 12h
  releaseName: sealed-secrets-web

  values:
    ingress:
      enabled: false
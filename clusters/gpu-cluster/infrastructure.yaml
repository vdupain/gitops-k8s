---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cilium
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cilium
  prune: true
  wait: true
  patches:
    - patch: |
        - op: replace
          path: /spec/blocks/0/start
          value: 192.168.10.215
        - op: replace
          path: /spec/blocks/0/stop
          value: 192.168.10.219
      target:
        kind: CiliumLoadBalancerIPPool
        name: default-pool
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cilium
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/storage
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers-network
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers-storage
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/network
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-vars
        optional: false
  patches:
    - patch: |
        - op: replace
          path: /spec/values/service/annotations/io.cilium~1lb-ipam-ips
          value: 192.168.10.215
      target:
        kind: HelmRelease
        name: coredns
    - patch: |
        - op: replace
          path: /spec/values/service/annotations/io.cilium~1lb-ipam-ips
          value: 192.168.10.216
      target:
        kind: HelmRelease
        name: traefik
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers-security
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers-network
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/security
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-vars
        optional: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-security-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers-security
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/security-config
  prune: true
  wait: true

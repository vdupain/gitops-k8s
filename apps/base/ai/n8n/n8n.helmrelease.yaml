---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: library/n8n
      version: '>=1.0.0'
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 12h

  values:
    ingress:
      enabled: false

    main:
      replicaCount: 1

      service:
        type: ClusterIP
        port: 5678

      persistence:
        enabled: true
        type: dynamic
        size: 5Gi
        storageClass: zfs
        accessModes:
          - ReadWriteOnce
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: n8n
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 12h

  values:
    replicaCount: 1

    ingress:
      enabled: false

    service:
      type: ClusterIP
      port: 5678

    persistence:
      enabled: true
      size: 5Gi
      storageClass: "zfs"

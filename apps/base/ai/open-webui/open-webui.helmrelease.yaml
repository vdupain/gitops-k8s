---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: open-webui
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      interval: 12h

  values:
    ingress:
      enabled: false
    ollama:
      enabled: true
      ollama:
        models:
          pull:
            - qwen3.5:9b
            - qwen3.5:0.8b
          run:
            - qwen3.5:9b
      persistentVolume:
        enabled: true
        size: 15Gi
      ingress:
        enabled: false
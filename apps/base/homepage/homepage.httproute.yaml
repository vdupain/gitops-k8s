---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${homepageHostname}"
  rules:
    - backendRefs:
        - name: homepage
          port: 3000
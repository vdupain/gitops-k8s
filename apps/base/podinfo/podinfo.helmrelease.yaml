apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: podinfo
      version: 6.14.1
      sourceRef:
        kind: HelmRepository
        name: podinfo
      interval: 12h
  releaseName: podinfo

  values:
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Podinfo"
        gethomepage.dev/group: "Apps"
      parentRefs:
        - name: gateway
          namespace: gateway
      hostnames:
        - ${podinfoIngressHost}

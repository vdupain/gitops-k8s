---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/group: "AI"
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${openwebuiHostname}"
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: open-webui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ollama"
    gethomepage.dev/group: "AI"
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "${ollamaHostname}"
  rules:
    - backendRefs:
        - name: open-webui-ollama
          port: 11434